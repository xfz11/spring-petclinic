name: Infrastructure - Provision Azure Resources

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

permissions:
  id-token: write
  contents: read

jobs:
  provision:
    name: Provision Azure Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep Infrastructure
        run: |
          az deployment sub create \
            --name "petclinic-${{ github.event.inputs.environment }}-$(date +%s)" \
            --location ${{ vars.AZURE_LOCATION }} \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters environmentName="${{ github.event.inputs.environment }}-petclinic"

      - name: Show deployment outputs
        run: |
          az deployment sub show \
            --name "petclinic-${{ github.event.inputs.environment }}-$(date +%s)" \
            --query properties.outputs \
            || echo "Deployment outputs may not be available yet."
